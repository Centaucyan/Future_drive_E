<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomy Studio - HMI UI Project</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/hmi_style.css">
</head>
<body class="h-screen w-screen flex flex-col justify-between relative select-none bg-slate-950 text-slate-100 overflow-hidden">

    <!-- 🚨 전체 긴급정지 상단 배너 -->
    <div id="masterEStopBanner" class="hidden absolute top-0 left-0 w-full bg-red-600/95 text-white py-2.5 px-6 flex items-center justify-between z-50 animate-pulse backdrop-blur">
        <div class="flex items-center gap-2 font-extrabold text-sm tracking-wide">
            <i class="fa-solid fa-triangle-exclamation text-xl"></i>
            <span>[MASTER E-STOP] 전체 로봇 통합 긴급정지 발동됨</span>
        </div>
        <button onclick="resetMasterEmergencyStop()" class="px-4 py-1.5 bg-white text-red-600 rounded-lg font-bold text-xs hover:bg-slate-100 transition-all shadow-md">
            전체 정지 해제
        </button>
    </div>

    <!-- 헤더 -->
    <header class="w-full px-8 py-4 flex items-center justify-between z-20 bg-slate-900/60 backdrop-blur-md border-b border-slate-800">
        <div class="flex items-center gap-3">
            <span class="font-extrabold text-xl tracking-wider text-white">AUTONOMY HMI</span>
            <span class="bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 text-[10px] px-2 py-0.5 rounded-md font-mono">ROS2 + YOLO</span>
        </div>

        <!-- 🤖 로봇 스위칭 버튼 -->
        <div class="flex bg-slate-950 p-1.5 rounded-full border border-slate-800 shadow-2xl">
            <button id="btn-r1" onclick="switchRobot(1)" class="flex items-center gap-3 px-6 py-2 rounded-full text-sm font-medium transition-all bg-blue-600 text-white shadow-md border border-blue-500">
                <span>Robot 1</span>
                <span class="w-2.5 h-2.5 rounded-full bg-blue-300 animate-ping"></span>
            </button>
            <button id="btn-r2" onclick="switchRobot(2)" class="flex items-center gap-3 px-6 py-2 rounded-full text-sm font-medium text-slate-400 hover:text-white transition-all bg-slate-900/60">
                <span>Robot 2</span>
                <span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span>
            </button>
        </div>

        <div class="flex items-center gap-3">
            <button onclick="triggerMasterEmergencyStop()" class="px-5 py-2 bg-red-600 hover:bg-red-700 text-white font-extrabold text-xs rounded-xl shadow-lg border border-red-400 flex items-center gap-2 transition-all">
                <i class="fa-solid fa-power-off text-sm"></i>
                <span>ALL STOP</span>
            </button>
        </div>
    </header>

    <!-- 지도 캔버스 영역 -->
    <div class="absolute inset-0 w-full h-full z-0">
        <canvas id="mapCanvas" class="w-full h-full"></canvas>
    </div>

    <!-- 하단 실시간 상태 대시보드 & 제어판 -->
    <div class="z-20 p-6 w-full flex flex-col items-center gap-3 pb-6">
        <div class="glass-panel w-full max-w-7xl rounded-[2rem] p-5 shadow-2xl flex flex-col lg:flex-row gap-6 items-stretch border border-slate-800 bg-slate-900/80 backdrop-blur-xl">
            
            <!-- 1. 제어 및 경로 설정 -->
            <div class="flex-1 flex flex-col justify-between gap-3">
                <div class="flex items-center justify-between text-xs px-1 border-b border-slate-800 pb-2">
                    <span class="font-bold text-slate-200" id="currentRobotTitle">Robot 1 Control</span>
                    <span class="text-emerald-400 font-mono text-[11px]" id="yoloDetectionBadge">YOLO: 대기 중</span>
                </div>

                <!-- 🔋 배터리, 킬로수, 속도 수치 카드 영역 -->
                <div class="grid grid-cols-3 gap-3 my-1">
                    <div class="bg-slate-950/80 border border-slate-800 p-3 rounded-xl flex flex-col items-center">
                        <span class="text-[10px] text-slate-400 flex items-center gap-1">
                            <i class="fa-solid fa-battery-three-quarters text-emerald-400"></i> 배터리 잔량
                        </span>
                        <span id="robotBattery" class="text-lg font-bold text-emerald-400 font-mono mt-0.5">--%</span>
                    </div>

                    <div class="bg-slate-950/80 border border-slate-800 p-3 rounded-xl flex flex-col items-center">
                        <span class="text-[10px] text-slate-400 flex items-center gap-1">
                            <i class="fa-solid fa-route text-blue-400"></i> 총 주행거리
                        </span>
                        <span id="robotMileage" class="text-lg font-bold text-blue-400 font-mono mt-0.5">-- km</span>
                    </div>

                    <div class="bg-slate-950/80 border border-slate-800 p-3 rounded-xl flex flex-col items-center">
                        <span class="text-[10px] text-slate-400 flex items-center gap-1">
                            <i class="fa-solid fa-gauge-high text-amber-400"></i> 실시간 속도
                        </span>
                        <span id="robotSpeed" class="text-lg font-bold text-amber-400 font-mono mt-0.5">-- m/s</span>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="originInput" placeholder="출발지 (예: A구역)" class="bg-slate-950 border border-slate-800 rounded-xl py-2 px-3 text-xs text-white focus:outline-none focus:border-blue-500">
                    <input type="text" id="destInput" placeholder="목적지 (예: B구역)" class="bg-slate-950 border border-slate-800 rounded-xl py-2 px-3 text-xs text-white focus:outline-none focus:border-blue-500">
                </div>

                <button onclick="applyRoute()" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-semibold transition-all shadow-md">
                    경로 명령 전달
                </button>
            </div>

            <!-- 2. ROS2 YOLO Vision 카메라 화면 -->
            <div class="w-full lg:w-[22rem] bg-slate-950 rounded-2xl p-3 flex flex-col justify-between border border-slate-800">
                <div class="flex items-center justify-between border-b border-slate-800 pb-2 mb-2 px-1">
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span class="text-xs font-semibold text-slate-200">ROS2 Vision CAM</span>
                    </div>
                    <span class="text-[10px] text-emerald-400 bg-emerald-950/80 border border-emerald-800 px-2 py-0.5 rounded-full font-mono">LIVE</span>
                </div>

                <div class="relative bg-slate-900 rounded-xl border border-slate-800 aspect-video overflow-hidden flex items-center justify-center">
                    <img id="camStreamImg" src="/api/cam-stream" class="w-full h-full object-cover" onerror="this.style.display='none'; document.getElementById('camFallback').classList.remove('hidden'); clearTimeout(this.retryTimer); this.retryTimer = setTimeout(() => { this.src = '/api/cam-stream?t=' + Date.now(); }, 3000);" onload="clearTimeout(this.retryTimer); this.style.display=''; document.getElementById('camFallback').classList.add('hidden');">
                    <div id="camFallback" class="hidden flex flex-col items-center gap-2 text-slate-500">
                        <i class="fa-solid fa-video-slash text-2xl"></i>
                        <span class="text-xs">카메라 신호 대기 중...</span>
                    </div>
                </div>

                <div class="flex items-center justify-between text-[10px] text-slate-400 px-1 mt-2">
                    <span>ROS2 Topic: /yolo/detections</span>
                    <span class="text-emerald-400 font-mono">30 FPS</span>
                </div>
            </div>

        </div>
    </div>

    <script src="/assets/js/views/hmi_map.js"></script>
    <script src="/assets/js/views/hmi_cam.js"></script>
    <script src="/assets/js/controllers/hmi_control.js"></script>
</body>
</html>
