<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ title }}</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: #fff;

            font-family: Arial, sans-serif;

            display: flex;
            flex-direction: column;

            align-items: center;
        }

        .header {
            width: 100%;
            padding: 16px;
            box-sizing: border-box;

            background: #1e1e1e;

            text-align: center;
            font-size: 20px;
        }

        .stream-container {
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
            box-sizing: border-box;
        }

        #camera-stream {
            max-width: 100%;
            max-height: calc(100vh - 100px);

            object-fit: contain;

            background: #000;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="header">
    /image_raw
</div>

<div class="stream-container">
    <img
        id="camera-stream"
        src="/image/stream"
        alt="image_raw stream"
    >
</div>

</body>
</html>
